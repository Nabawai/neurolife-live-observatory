name: Bootstrap NeuroLife Observatory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Observatory package
        run: |
          set -e

          ZIP="NEUROLIFE-GITHUB-LIVE-OBSERVATORY-V24.1-OIDC.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP_NOT_FOUND: $ZIP"
            exit 1
          fi

          mkdir -p /tmp/neurolife-observatory
          unzip -q "$ZIP" -d /tmp/neurolife-observatory

          rsync -a /tmp/neurolife-observatory/ ./

          echo "=== Extracted files ==="
          find . -maxdepth 4 -type f | sort

      - name: Commit extracted Observatory
        run: |
          git config user.name "neurolife-bootstrap[bot]"
          git config user.email "neurolife-bootstrap[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi

          git commit -m "feat: install NeuroLife GitHub Live Observatory V24.1"
          git push
