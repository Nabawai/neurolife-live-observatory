name: Repair NeuroLife Observatory Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore directory structure
        run: |
          set -e

          mkdir -p src config scripts contracts baselines .github/workflows

          mv -f audit.mjs src/audit.mjs
          mv -f control-plane.mjs src/control-plane.mjs
          mv -f interactions.mjs src/interactions.mjs
          mv -f redact.mjs src/redact.mjs
          mv -f roles.mjs src/roles.mjs
          mv -f visual-diff.mjs src/visual-diff.mjs

          mv -f interactions.json config/interactions.json
          mv -f privacy.json config/privacy.json
          mv -f routes.json config/routes.json
          mv -f viewports.json config/viewports.json

          mv -f get-neurolife-session.mjs scripts/get-neurolife-session.mjs
          mv -f publish-safe-status.mjs scripts/publish-safe-status.mjs
          mv -f update-baseline.mjs scripts/update-baseline.mjs
          mv -f validate-config.mjs scripts/validate-config.mjs

          mv -f OBSERVATORY_OIDC_EXCHANGE_1.json \
            contracts/OBSERVATORY_OIDC_EXCHANGE_1.json

          touch baselines/.gitkeep

      - name: Commit repaired structure
        run: |
          git config user.name "neurolife-bootstrap[bot]"
          git config user.email "neurolife-bootstrap[bot]@users.noreply.github.com"

          git add -A
          git commit -m "fix: restore NeuroLife Observatory repository structure"
          git push
